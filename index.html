<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BC 15 2 League Dashboard</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--tx:#1b1b1b;--mu:#666;--bd:#ddd;--ac:#D4242C;--s:#0a6b2d;--n:#1c4fd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--tx:#eee;--mu:#9a9a9a;--bd:#333;--ac:#ff5a61;--s:#4cc36f;--n:#7da2ff}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--tx:#eee;--mu:#9a9a9a;--bd:#333;--ac:#ff5a61;--s:#4cc36f;--n:#7da2ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 16px 0;max-width:1100px;margin:auto}
h1{margin:0;font-size:22px}.sub{color:var(--mu);font-size:13px}
main{max-width:1100px;margin:auto;padding:12px 16px 40px}
.tabs,.pills{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
button,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px}
button{cursor:pointer}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);text-transform:uppercase}td.n,th.n{text-align:right}
.S{color:var(--s);font-weight:600}.N{color:var(--n);font-weight:600}.U{color:var(--mu)}
.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:110px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:22px}.muted{color:var(--mu);font-size:13px}
textarea{width:100%;height:130px;font:12px monospace}
.past td{color:var(--mu)}
.us{color:var(--ac);font-weight:700}
button.us{border-color:var(--ac)}
button.us.on{color:#fff}
option.us{color:#D4242C;font-weight:700}
.usrow td{color:var(--ac)!important;font-weight:700}
</style></head><body>
<header><h1>BC 15 2 League Dashboard</h1><div class="sub">data from TeamLinkt team pages</div></header>
<main>
<div class="kpi" id="kpi"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<script>
var SEED=[],EXTRA=[];
var DB={teams:{}},tab="stats",scope="League",sortKey="pts",gSort="w",sch={div:"All",team:"All"};
try{var s=localStorage.getItem("y4dash");if(s)DB=JSON.parse(s)}catch(e){}
DB.seeded=DB.seeded||[];
SEED.forEach(function(t){if(DB.seeded.indexOf(t.id)<0&&!DB.teams[t.id]){DB.teams[t.id]=t}if(DB.seeded.indexOf(t.id)<0)DB.seeded.push(t.id)});
SEED.forEach(function(t){var x=DB.teams[t.id];if(x&&x.division==="Unassigned"&&t.division!=="Unassigned")x.division=t.division});
save();
function save(){try{localStorage.setItem("y4dash",JSON.stringify(DB))}catch(e){}}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function short(n){return n.replace(/^U\d+\s+/,"")}
function titleCase(n){return n===n.toUpperCase()?n.toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase()}):n}

// ---- import ----
function extract(txt){
  var m="__TEAMLINKT_SITE__",i=txt.indexOf(m),st;
  st=txt.indexOf("{",i<0?0:i);if(st<0)throw "No JSON found";
  var d=0,q=false,e=false,j;
  for(j=st;j<txt.length;j++){var c=txt[j];
    if(q){if(e)e=false;else if(c==="\\")e=true;else if(c==='"')q=false}
    else if(c==='"')q=true;else if(c==="{")d++;else if(c==="}"){d--;if(!d)break}}
  return JSON.parse(txt.slice(st,j+1));
}
function normalize(site){
  var ctx=site.entityPageContext;if(!ctx||ctx.type!=="team")throw "Not a team page";
  var D=ctx.data,T=D.teamData,id=T.id,ab={};
  (D.statistics.statistics||[]).forEach(function(s){ab[s.id]=s.abbreviation});
  var staff={};(D.roster.staff||[]).forEach(function(s){staff[s.name.toLowerCase()]=1});
  var ros={};D.roster.players.forEach(function(p){ros[p.name.toLowerCase()]=p});
  var players=[],seen={};
  (D.statistics.players||[]).forEach(function(p){
    var k=p.name.toLowerCase();if(staff[k])return;
    var r=ros[k]||{},st={};for(var x in p.stats)st[ab[x]]=p.stats[x];
    var o={name:titleCase(p.name),num:r.jerseyNumber||"",pos:r.position||"",gp:st.GP||0};
    if(st.SV!=null||st.W!=null||st.SO!=null)o.goalie={w:st.W||0,l:st.L||0,t:st.T||0,so:st.SO||0,ga:st.GA||0,sv:st.SV||0};
    if(st.G!=null||st.A!=null||st.PTS!=null||!o.goalie){o.g=st.G||0;o.a=st.A||0;o.pts=st.PTS||0;o.pim=st.PIM||0}
    players.push(o);seen[k]=1});
  D.roster.players.forEach(function(p){var k=p.name.toLowerCase();if(!seen[k])players.push({name:titleCase(p.name),num:p.jerseyNumber,pos:p.position,gp:0,g:0,a:0,pts:0,pim:0})});
  var gm={};
  function add(g,sc){var o={id:g.id,date:g.date,home:g.homeTeam||g.homeTeamName,away:g.awayTeam||g.awayTeamName,loc:g.location,time:g.startTime};
    if(sc){o.hs=g.homeScore;o.as=g.awayScore}gm[g.id]=Object.assign(gm[g.id]||{},o)}
  ((D.scheduleGames||{}).data||[]).forEach(function(g){add(g)});
  if(D.lastGame)add(D.lastGame,true);
  return {id:id,name:T.name,division:(DB.teams[id]||{}).division||"Unassigned",players:players,games:Object.keys(gm).map(function(k){return gm[k]})};
}
function doImport(){
  var box=document.getElementById("imp"),msg=document.getElementById("msg"),parts=box.value.split(/<!DOCTYPE/i).filter(function(x){return x.trim()}),n=0;
  try{(parts.length>1?parts.map(function(p){return"<!DOCTYPE"+p}):[box.value]).forEach(function(p){var t=normalize(extract(p)),m=p.match(/DIV:(South|North)/),ty=(p.match(/TYPE:(Exhibition|Seeding|Season)/)||[])[1]||"Seeding",old=DB.teams[t.id];if(m)t.division=m[1];t.stats=Object.assign({},old&&(old.stats||{Seeding:old.players}));t.stats[ty]=t.players;DB.teams[t.id]=t;n++});
    save();box.value="";tab="stats";msg.textContent="Imported "+n+" team(s). Set each team’s division on the Teams tab.";
  }catch(e){msg.textContent="Import failed: "+e}
  render();
}

// ---- stats ----
function rankBy(list,keyf){ // competition ranking
  var s=list.slice().sort(keyf),r=new Map(),prev=null,rk=0;
  s.forEach(function(p,i){if(!prev||keyf(prev,p)!==0)rk=i+1;r.set(p,rk);prev=p});return r;
}
var cmpSk=function(a,b){return b.pts-a.pts||b.g-a.g||a.pim-b.pim};
function allSkaters(){var o=[];Object.keys(DB.teams).forEach(function(id){var t=DB.teams[id];t.players.forEach(function(p){if(p.pts!=null)o.push(Object.assign({team:t.name,div:t.division},p))})});return o}
function allGoalies(){var o=[];Object.keys(DB.teams).forEach(function(id){var t=DB.teams[id];t.players.forEach(function(p){if(p.goalie)o.push(Object.assign({team:t.name,div:t.division},p,p.goalie))})});return o}
function pill(opts,cur,fn){return '<div class="pills">'+opts.map(function(o){return '<button class="'+(o===cur?"on":"")+'" onclick="'+fn+'(\''+o+'\')">'+o+'</button>'}).join("")+'</div>'}
function setScope(v){scope=v;render()}function setSort(v){sortKey=v;render()}
function statsView(){
  var all=allSkaters(),lr=rankBy(all,cmpSk),dr=new Map();
  ["South","North","Unassigned"].forEach(function(d){var l=all.filter(function(p){return p.div===d});rankBy(l,cmpSk).forEach(function(v,k){dr.set(k,v)})});
  var list=all.filter(function(p){return scope==="League"||p.div===scope});
  var cmp=sortKey==="pts"?cmpSk:function(a,b){return b[sortKey]-a[sortKey]||cmpSk(a,b)};
  list.sort(cmp);
  var h=pill(["League","South","North"],scope,"setScope")+'<div class="muted">Sort: '+["pts","g","a","pim"].map(function(k){return '<button class="'+(k===sortKey?"on":"")+'" onclick="setSort(\''+k+'\')">'+k.toUpperCase()+'</button>'}).join(" ")+' · ties share a rank (PTS, then G, then fewer PIM)</div>';
  h+='<div class="card w"><table><tr><th class="n">Div #</th><th class="n">League #</th><th>Player</th><th>Team</th><th>Div</th><th class="n">GP</th><th class="n">G</th><th class="n">A</th><th class="n">PTS</th><th class="n">PIM</th></tr>';
  list.forEach(function(p){h+='<tr><td class="n">'+dr.get(p)+'</td><td class="n">'+lr.get(p)+'</td><td>'+esc(p.name)+(p.num?' <span class="U">#'+esc(p.num)+'</span>':'')+'</td><td>'+esc(short(p.team))+'</td><td class="'+(p.div[0])+'">'+p.div+'</td><td class="n">'+p.gp+'</td><td class="n">'+p.g+'</td><td class="n">'+p.a+'</td><td class="n"><b>'+p.pts+'</b></td><td class="n">'+p.pim+'</td></tr>'});
  h+='</table></div>';
  var gl=allGoalies().filter(function(p){return scope==="League"||p.div===scope}).sort(function(a,b){return b.w-a.w||b.so-a.so||a.ga-b.ga});
  if(gl.length){h+='<h3>Goalies</h3><div class="card w"><table><tr><th>Goalie</th><th>Team</th><th class="n">GP</th><th class="n">W</th><th class="n">L</th><th class="n">T</th><th class="n">SO</th><th class="n">GA</th><th class="n">SV</th></tr>';
    gl.forEach(function(p){h+='<tr><td>'+esc(p.name)+'</td><td>'+esc(short(p.team))+'</td><td class="'+p.div[0]+'">'+p.div+'</td><td class="n">'+p.gp+'</td><td class="n">'+p.w+'</td><td class="n">'+p.l+'</td><td class="n">'+p.t+'</td><td class="n">'+p.so+'</td><td class="n">'+p.ga+'</td><td class="n">'+p.sv+'</td></tr>'});h+='</table></div>'}
  return h;
}

// ---- schedule ----
function allGames(){var m={};EXTRA.forEach(function(g){m[g.id]=Object.assign({},g)});Object.keys(DB.teams).forEach(function(id){DB.teams[id].games.forEach(function(g){m[g.id]=Object.assign(m[g.id]||{},g)})});return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)})}
function divOf(name){for(var id in DB.teams)if(DB.teams[id].name===name)return DB.teams[id].division;return"?"}
function scheduleView(){
  var gs=allGames(),names={};gs.forEach(function(g){names[g.home]=1;names[g.away]=1});
  var tl=Object.keys(names).sort();
  var h='<div class="pills"><select onchange="sch.team=this.value;render()"><option>All</option>'+tl.map(function(t){return'<option value="'+esc(t)+'"'+(sch.team===t?" selected":"")+'>'+esc(short(t))+'</option>'}).join("")+'</select></div>';
  gs=gs.filter(function(g){return(sch.team==="All"||g.home===sch.team||g.away===sch.team)});
  h+='<div class="card w"><table><tr><th>Date</th><th>Time</th><th>Home</th><th>Away</th><th>Score</th><th>Rink</th></tr>';
  gs.forEach(function(g){var pl=g.hs!=null;h+='<tr class="'+(pl?"past":"")+'"><td>'+esc(g.date)+'</td><td>'+esc(g.time)+'</td><td>'+esc(short(g.home))+'</td><td>'+esc(short(g.away))+'</td><td>'+(pl?g.hs+" – "+g.as:"")+'</td><td>'+esc(g.loc)+'</td></tr>'});
  return h+'</table></div><div class="muted">'+gs.length+' games shown (duplicates across team pages are merged).</div>';
}

// ---- teams & results ----
function setDiv(id,v){DB.teams[id].division=v;save();render()}
function delTeam(id){delete DB.teams[id];save();render()}
function teamsView(){
  var rec={};Object.keys(DB.teams).forEach(function(id){rec[DB.teams[id].name]={w:0,l:0,t:0,gf:0,ga:0}});
  allGames().forEach(function(g){if(g.hs==null)return;[[g.home,g.hs,g.as],[g.away,g.as,g.hs]].forEach(function(x){var r=rec[x[0]];if(!r)return;r.gf+=x[1];r.ga+=x[2];x[1]>x[2]?r.w++:x[1]<x[2]?r.l++:r.t++})});
  var rows=Object.keys(DB.teams).map(function(id){return DB.teams[id]}).sort(function(a,b){var x=rec[a.name],y=rec[b.name];return(y.w*2+y.t)-(x.w*2+x.t)||(y.gf-y.ga)-(x.gf-x.ga)});
  var h='<div class="card w"><table><tr><th>Team</th><th>Division</th><th class="n">GP</th><th class="n">W</th><th class="n">L</th><th class="n">T</th><th class="n">PTS</th><th class="n">GF</th><th class="n">GA</th><th>Players</th><th></th></tr>';
  rows.forEach(function(t){var r=rec[t.name];h+='<tr><td>'+esc(short(t.name))+'</td><td><select onchange="setDiv('+t.id+',this.value)">'+["South","North","Unassigned"].map(function(d){return'<option'+(t.division===d?" selected":"")+'>'+d+'</option>'}).join("")+'</select></td><td class="n">'+(r.w+r.l+r.t)+'</td><td class="n">'+r.w+'</td><td class="n">'+r.l+'</td><td class="n">'+r.t+'</td><td class="n"><b>'+(r.w*2+r.t)+'</b></td><td class="n">'+r.gf+'</td><td class="n">'+r.ga+'</td><td>'+t.players.length+'</td><td><button onclick="delTeam('+t.id+')">Remove</button></td></tr>'});
  return h+'</table></div><div class="muted">Results come from the “last game” on each imported team page, so records fill in as more team pages are imported. Points: 2 for a win, 1 for a tie.</div>';
}
var SNIP='(async()=>{const L={South:"945176 945177 946145 946146 946147 945175 946241 948259 948260 948222",North:"955694 950570 955728 945219 946211 950569 955082 955693 945218"};let o="";for(const d in L)for(const id of L[d].split(" ")){const h=await(await fetch("/hockeycalgary/view/team/"+id)).text();const i=h.indexOf("window.__TEAMLINKT_SITE__");o+="<!DOCTYPE DIV:"+d+" "+h.slice(i,h.indexOf("</scr"+"ipt>",i))+" "}copy(o);console.log("Copied "+o.length+" chars")})()';
function importView(){
  return '<div class="card"><p><b>Import all 19 teams at once.</b> On any leagues.teamlinkt.com/hockeycalgary page in Chrome, open DevTools → Console (type “allow pasting” first if prompted), paste the script below and press Enter. It copies every team’s data to your clipboard. Paste that into the box further down and press Import — South and North are set automatically.</p><textarea readonly onclick="this.select()" style="height:100px">'+esc(SNIP)+'</textarea></div><div class="card"><p><b>Add teams.</b> Open each team’s page, view source (or save the page), copy everything, and paste it below. Several pages can be pasted at once — the importer reads the embedded team data for roster, stats and schedule. Then set the team’s division on the Teams tab.</p><textarea id="imp" onpaste="setTimeout(doImport,300)" placeholder="Paste team page source here…"></textarea><p><button class="on" onclick="doImport()">Import</button> <span id="msg" class="muted"></span></p></div>';
}

// ---- v2 views (override earlier versions) ----
var TY={Seeding:1,Season:1},TF={},stKey="pts",TYPES=["Seeding","Season"],tOpen=false;
function toggleTy(k){if(TY[k])delete TY[k];else TY[k]=1;render()}
function toggleTeam(n){if(TF[n])delete TF[n];else TF[n]=1;render()}
function clearTeams(){TF={};render()}
function setSort(v){stKey=v;render()}
function setPast(v){sch.past=v;render()}
function collect(kind){
  var by={};
  Object.keys(DB.teams).forEach(function(id){var t=DB.teams[id],sets=t.stats||{Seeding:t.players};
    Object.keys(sets).forEach(function(ty){if(ty==="Exhibition"||!TY[ty])return;
      sets[ty].forEach(function(p){
        if(kind==="sk"?p.pts==null:!p.goalie)return;
        var k=id+"|"+p.name.toLowerCase(),c=by[k];
        if(!c){c=by[k]=Object.assign({team:t.name,div:t.division},p);if(p.goalie)c.goalie=Object.assign({},p.goalie);return}
        c.gp+=p.gp||0;
        if(kind==="sk"){c.g+=p.g;c.a+=p.a;c.pts+=p.pts;c.pim+=p.pim}
        else{for(var f in p.goalie)c.goalie[f]=(c.goalie[f]||0)+p.goalie[f]}
      })})});
  return Object.keys(by).map(function(k){return by[k]});
}
function rate(p,key){return p.gp?p[key]/p.gp:0}
function cmpStat(key){return function(a,b){return b[key]-a[key]||rate(b,key)-rate(a,key)}}
function rankMap(list,key){var c=cmpStat(key),s=list.slice().sort(c),m=new Map(),i=0;while(i<s.length){var j=i;while(j+1<s.length&&c(s[i],s[j+1])===0)j++;for(var x=i;x<=j;x++)m.set(s[x],j>i?"T-"+(i+1):String(i+1));i=j+1}return m}
function teamList(){var o={League:0};return Object.keys(DB.teams).map(function(i){return DB.teams[i]}).sort(function(a,b){return(o[a.division]-o[b.division])||a.name.localeCompare(b.name)})}
function statsView(){
  var all=collect("sk"),k=stKey,lr=rankMap(all,k),tn=Object.keys(TF);
  var keep=function(p){return!tn.length||TF[p.team]};
  var list=all.filter(keep).sort(function(a,b){return cmpStat(k)(a,b)||a.name.localeCompare(b.name)});
  var h='';
  h+='<div class="muted">Game type</div><div class="pills">'+TYPES.map(function(t){return'<button class="'+(TY[t]?"on":"")+'" onclick="toggleTy(\''+t+'\')">'+t+'</button>'}).join("")+'</div>';
  h+='<div class="muted">Rank &amp; sort by</div><div class="pills">'+[["pts","Points"],["g","Goals"],["a","Assists"],["pim","Penalty min"]].map(function(x){return'<button class="'+(x[0]===k?"on":"")+'" onclick="setSort(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div>';
  h+='<details class="card" ontoggle="tOpen=this.open"'+(tOpen?' open':'')+'><summary><b>Teams</b> '+(tn.length?'('+tn.length+' selected)':'(all)')+'</summary><div class="pills">'+teamList().map(function(t){return'<button class="'+(TF[t.name]?"on":"")+'" data-n="'+esc(t.name)+'" onclick="toggleTeam(this.dataset.n)">'+esc(short(t.name))+' ('+t.division[0]+')</button>'}).join("")+(tn.length?'<button onclick="clearTeams()">Clear</button>':'')+'</div></details>';
  h+='<div class="muted">Ranks are among all players in the league for the selected game types, even when you filter to certain teams. Ties are broken by the selected stat per game played; players still tied share a rank (T-1).</div>';
  var L=k.toUpperCase(),cell=function(key,v){return'<td class="n"'+(key===k?' style="font-weight:700"':'')+'>'+v+'</td>'};
  h+='<div class="card w"><table><tr><th class="n">Rank ('+L+')</th><th>Player</th><th>Team</th><th class="n">GP</th><th class="n">G</th><th class="n">A</th><th class="n">PTS</th><th class="n">PIM</th></tr>';
  list.forEach(function(p){h+='<tr><td class="n"><b>'+lr.get(p)+'</b></td><td>'+esc(p.name)+(p.num?' <span class="U">#'+esc(p.num)+'</span>':'')+'</td><td>'+esc(short(p.team))+'</td>'+cell("gp",p.gp)+cell("g",p.g)+cell("a",p.a)+cell("pts",p.pts)+cell("pim",p.pim)+'</tr>'});
  if(!list.length)h+='<tr><td colspan="8" class="U">No players match. Check the game type and team filters (current data is tagged Seeding).</td></tr>';
  h+='</table></div>';
  var gl=collect("gl").filter(keep).sort(function(a,b){return b.goalie.w-a.goalie.w||b.goalie.so-a.goalie.so||a.goalie.ga-b.goalie.ga});
  if(gl.length){h+='<h3>Goalies</h3><div class="card w"><table><tr><th>Goalie</th><th>Team</th><th class="n">GP</th><th class="n">W</th><th class="n">L</th><th class="n">T</th><th class="n">SO</th><th class="n">GA</th><th class="n">GAA</th></tr>';
    gl.forEach(function(p){var o=p.goalie,gaa=p.gp?(o.ga/p.gp).toFixed(2):"–";h+='<tr><td>'+esc(p.name)+'</td><td>'+esc(short(p.team))+'</td><td class="n">'+p.gp+'</td><td class="n">'+o.w+'</td><td class="n">'+o.l+'</td><td class="n">'+o.t+'</td><td class="n">'+o.so+'</td><td class="n">'+o.ga+'</td><td class="n">'+gaa+'</td></tr>'});h+='</table></div>'}
  return h;
}
function teamsView(){
  var rec={};Object.keys(DB.teams).forEach(function(id){rec[DB.teams[id].name]={w:0,l:0,t:0,gf:0,ga:0}});
  allGames().forEach(function(g){if(g.hs==null)return;[[g.home,g.hs,g.as],[g.away,g.as,g.hs]].forEach(function(x){var r=rec[x[0]];if(!r)return;r.gf+=x[1];r.ga+=x[2];x[1]>x[2]?r.w++:x[1]<x[2]?r.l++:r.t++})});
  var h="";
  Object.keys(DB.teams).forEach(function(id){var q=(window.ST||{})[id];if(q)rec[DB.teams[id].name]={w:q.w,l:q.l,t:q.t,gf:q.gf,ga:q.ga}});
  ["League"].forEach(function(d){
    var rows=teamList().filter(function(t){return t.division===d});if(!rows.length)return;
    var pts=function(r){return r.w*2+r.t},sc=function(t){return rec[t.name]};
    rows.sort(function(a,b){var x=sc(a),y=sc(b);return pts(y)-pts(x)||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||a.name.localeCompare(b.name)});
    h+='<div class="card w"><table><tr><th class="n">#</th><th>Team</th><th class="n">GP</th><th class="n">W</th><th class="n">L</th><th class="n">T</th><th class="n">PTS</th><th class="n">GF</th><th class="n">GA</th><th class="n">DIFF</th></tr>';
    rows.forEach(function(t,i){var r=sc(t),df=r.gf-r.ga;h+='<tr><td class="n">'+(i+1)+'</td><td>'+esc(short(t.name))+'</td><td class="n">'+(r.w+r.l+r.t)+'</td><td class="n">'+r.w+'</td><td class="n">'+r.l+'</td><td class="n">'+r.t+'</td><td class="n"><b>'+pts(r)+'</b></td><td class="n">'+r.gf+'</td><td class="n">'+r.ga+'</td><td class="n">'+(df>0?"+":"")+df+'</td></tr>'});
    h+='</table></div>';
  });
  return h+'<div class="muted">Records come from the league standings (2 points for a win, 1 for a tie). Points here are calculated for ranking and may differ slightly from the league table.</div>';
}
function tmin(t){var m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t||"");if(!m)return 0;return(+m[1]%12+(/PM/i.test(m[3])?12:0))*60+ +m[2]}
function scheduleView(){
  var gs=allGames(),names={};gs.forEach(function(g){names[g.home]=1;names[g.away]=1});
  var tl=Object.keys(names).sort(),td=new Date(),today=td.getFullYear()+"-"+("0"+(td.getMonth()+1)).slice(-2)+"-"+("0"+td.getDate()).slice(-2);
  var h='<div class="pills"><select onchange="sch.team=this.value;render()"><option>All</option>'+tl.map(function(t){return'<option value="'+esc(t)+'"'+(sch.team===t?" selected":"")+'>'+esc(short(t))+'</option>'}).join("")+'</select><button class="'+(sch.past?"on":"")+'" onclick="setPast('+(sch.past?"false":"true")+')">'+(sch.past?"Show Upcoming Games":"Show Past Games & Scores")+'</button></div>';
  gs=gs.filter(function(g){return(sch.team==="All"||g.home===sch.team||g.away===sch.team)});
  var isPast=function(g){return g.date<today||g.hs!=null},key=function(g){return g.date+("0000"+tmin(g.time)).slice(-4)};
  var up=gs.filter(function(g){return!isPast(g)}).sort(function(a,b){return key(a).localeCompare(key(b))}),pa=gs.filter(isPast).sort(function(a,b){return key(b).localeCompare(key(a))});
  var day=function(d){return new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})};
  var tbl=function(rows,past){var t='<div class="card w"><table><tr><th>Date</th><th>Time</th><th>Home</th><th>Away</th>'+(past?'<th>Score</th>':'')+'<th>Rink</th></tr>';rows.forEach(function(g){t+='<tr><td>'+day(g.date)+'</td><td>'+esc(g.time)+'</td><td>'+esc(short(g.home))+'</td><td>'+esc(short(g.away))+'</td>'+(past?'<td>'+(g.hs!=null?g.hs+' – '+g.as:'—')+'</td>':'')+'<td>'+esc(g.loc)+'</td></tr>'});if(!rows.length)t+='<tr><td colspan="6" class="U">No games.</td></tr>';return t+'</table></div>'};
  if(!sch.past)h+='<h3>Upcoming ('+up.length+')</h3>'+tbl(up,false);
  if(sch.past)h+='<h3>Past games &amp; scores ('+pa.length+')</h3>'+tbl(pa,true)+'<div class="muted">Scores show only where the league page exposes them (each team\u2019s latest result).</div>';
  return h;
}
function hl(){
  var v=document.getElementById("view"),US="Knights BC 2 Black";
  v.querySelectorAll("td").forEach(function(td){var tx=td.textContent.trim();if(tx!==US&&tx.slice(-US.length)!==US)return;td.classList.add("us");var tr=td.parentNode;tr.classList.add("usrow");var t=tr.closest("table");if(!t||!t.rows[0])return;var hc=Array.prototype.map.call(t.rows[0].cells,function(c){return c.textContent.trim()}),i=hc.findIndex(function(x){return x==="Player"||x==="Goalie"});if(i>=0&&tr.cells[i])tr.cells[i].classList.add("us")});
  v.querySelectorAll("button").forEach(function(b){if(b.textContent.trim().indexOf(US)>=0)b.classList.add("us")});
  v.querySelectorAll("option").forEach(function(o){if(o.textContent.trim().slice(-US.length)===US)o.classList.add("us")});
}

function render(){
  var T=Object.keys(DB.teams).map(function(i){return DB.teams[i]}),sk=allSkaters(),G=allGames();
  var c=function(d){return T.filter(function(t){return t.division===d}).length};
  document.getElementById("kpi").innerHTML=[["Teams",T.length],["Skaters",sk.length],["Games",G.length]].map(function(k){return"<div><b>"+k[1]+"</b>"+k[0]+"</div>"}).join("");
  var tabs=[["stats","Player Stats"],["sched","Schedule & Scores"],["teams","Standings"],["imp","Import"]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){return'<button class="'+(t[0]===tab?"on":"")+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join("");
  document.getElementById("view").innerHTML={stats:statsView,sched:scheduleView,teams:teamsView,imp:importView}[tab]();hl();
}

function loadLive(){
  fetch("data.json?"+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    DB.teams={};(d.teams||[]).forEach(function(e){try{
      var t=normalize(e.site),old=DB.teams[t.id];t.division=e.div;
      t.stats=Object.assign({},old&&old.stats);t.stats.Seeding=t.players;DB.teams[t.id]=t}catch(x){}});
    window.ST=d.standings||{};
    var hist=d.history||{};
    Object.keys(DB.teams).forEach(function(id){var t=DB.teams[id],m={};t.games.forEach(function(g){m[g.id]=g});
      Object.keys(hist).forEach(function(k){var g=hist[k];if(g.home===t.name||g.away===t.name)m[g.id]=Object.assign(m[g.id]||{},g)});
      t.games=Object.keys(m).map(function(k){return m[k]})});
    save();
    var u=document.querySelector("header .sub");
    if(u&&d.updated)u.innerHTML+=" · <b>Updated "+new Date(d.updated).toLocaleString([], {dateStyle:"medium",timeStyle:"short"})+"</b>";
    render();
  }).catch(function(){});
}
render();loadLive();

</script></body></html>
